<script>
(() => {
// ------------------------------------------------------------------ shared helpers
const D = JSON.parse(document.getElementById('toy').textContent);
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const stag = (e, i, N, spread) => clamp((e - spread * (N > 1 ? i / (N - 1) : 0)) / (1 - spread));
const RGB = {};
const rgbOf = h => RGB[h] || (RGB[h] = [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
const toHex = c => '#' + c.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
const mixHex = (a, b, t) => { const A = rgbOf(a), B = rgbOf(b); return toHex([0, 1, 2].map(k => A[k] + (B[k] - A[k]) * t)); };
const f1 = v => Math.round(v * 10) / 10;
const pct = x => Math.round(100 * x) + '%';
const C = { ink: '#1D2731', ink2: '#4B5966', mute: '#8796A3', teal: '#2B5A6E', tealL: '#7FA9B8', red: '#C8473D', green: '#3B9466',
  amb: '#D9822B', ambD: '#8A4B12', grey: '#CDD5DC', base: '#AEB9C4', line: '#C7D1DA', panel: '#F2F5F8', plane: '#F0F3F6', head: '#2C3A47' };
const SANS = 'Arimo, Liberation Sans, Arial, Noto Sans Math, sans-serif', SERIF = 'Tinos, Liberation Serif, Times New Roman, Noto Sans Math, Cambria Math, serif';
const txt = (x, y, s, attrs, parent) => { const t = mk('text', Object.assign({ x, y, 'font-family': SANS, 'font-size': 13, fill: C.ink2 }, attrs || {}), parent); t.textContent = s; return t; };
const tsp = (t, s, attrs) => { const e = mk('tspan', attrs || {}, t); e.textContent = s; return e; };
const HALO = { 'paint-order': 'stroke', stroke: '#FFFFFF', 'stroke-width': 4, 'stroke-linejoin': 'round' };
const SS = (sub, sup) => `<span class="ss"><span>${sup}</span><span>${sub}</span></span>`;
const NUM = k => `<span class="num">(${k})</span>`;
const box = (x, y, w, h, parent, opts) => mk('rect', Object.assign({ x, y, width: w, height: h, rx: 8, fill: C.panel, stroke: '#C9D3DC' }, opts || {}), parent);
const arrow = (x1, y1, x2, y2, parent, opts) => mk('line', Object.assign({ x1, y1, x2, y2, stroke: '#7D8C99', 'stroke-width': 1.5, 'marker-end': 'url(#ah)' }, opts || {}), parent);
const lines = (x, y, arr, dy, attrs, parent) => arr.map((s, i) => txt(x, y + i * dy, s, attrs, parent));
const op = (el, v) => el.setAttribute('opacity', (+v).toFixed(3));
// ================================================================== PTSD walkthrough (numbers from the paper; drawings schematic)
const SRC = 'Hwang, Skarica, Xu et al., Nature 2025';
const CT = { EXN: '#D9776B', IN: '#5FA36B', OLG: '#5E8DBF', OPC: '#8E7CC3', END: '#C9A227', AST: '#4FA3A5', MG: '#B5651D' };
const CTD = { EXN: '#A3433A', IN: '#2F7A3D', OLG: '#2F5F93', OPC: '#5E4C9B', END: '#7F640C', AST: '#256E70', MG: '#7E4310' };
const CTN = { EXN: 'Excitatory neurons', IN: 'Inhibitory neurons', OLG: 'Oligodendrocytes', OPC: 'OPCs', END: 'Endothelial cells', AST: 'Astrocytes', MG: 'Microglia' };
const GP = { PTSD: '#3E6FB0', MDD: '#E39B2E', CON: '#A3AEB8' }, GPD = { PTSD: '#2C5490', MDD: '#A8650C', CON: '#5F6B76' };
const DOWN = '#4F79B5', UP = '#C8553D', FK = '#8B2F7E';
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const DG = D.deg, FKB = D.fkbp5, CR = D.cre, SN = D.snp;
const degTot = Object.fromEntries(D.degByType.map(([t, d, u]) => [t, d + u]));

const SCENES = [
  ['The question', 'Which brain cells change in PTSD?'],
  ['The data', 'Two million nuclei, four assays, seven cell types'],
  ['Expression', `${fmt(DG.ptsd)} genes change, cell type by cell type`],
  ['Blood vessels', 'A stress-hormone gene rises in endothelial cells'],
  ['Inhibition', 'Somatostatin interneurons send less GABA'],
  ['Regulation', 'Linking open chromatin to the genes it controls'],
  ['Genetic risk', 'From a risk variant to the gene it may control'],
  ['Summary', 'PTSD in the prefrontal cortex, cell by cell'],
];
const CHIP = ['Question', 'Data', 'Expression', 'Vessels', 'Inhibition', 'Regulation', 'Risk', 'Summary'];
const BASE = { coh: 0, data: 0, deg: 0, end: 0, sst: 0, reg: 0, risk: 0, recap: 0, dur: 1700 };

const S = [
  { scene: 0, st: { coh: 1 },
    cap: `<b>111 donors</b>: 36 with PTSD, 36 with major depression (MDD) as a psychiatric comparison, and 39 controls. Earlier studies implicated several pathways, so a single cell type is unlikely to explain PTSD.`,
    fn: `${SRC} · dorsolateral prefrontal cortex (DLPFC), post-mortem · brain drawing is schematic`,
    note: 'PTSD develops after severe trauma in about 6 to 8 percent of people. It is moderately heritable, 24 to 40 percent, and highly polygenic: many variants each add a little risk. Earlier studies of post-mortem brain tissue pointed to several pathways at once, GABA signalling, immunity and stress hormones, so a single cell type is unlikely to explain it. This study profiled single nuclei from the dorsolateral prefrontal cortex of 111 donors: 36 with PTSD; 36 with major depression, which affects more than half of people with PTSD and serves as a psychiatric comparison; and 39 with neither.' },
  { scene: 1, st: { data: 1, dur: 1900 },
    cap: 'More than two million nuclei: gene expression, open chromatin, both in the same nucleus, and a 366-gene spatial panel. Seven major cell types, with four excitatory and five inhibitory neuron subtypes.',
    fn: `${SRC}, Fig. 1b–d and Fig. 2a · the cluster map is a schematic, not the paper’s embedding`,
    note: `From these donors the team profiled more than two million nuclei. Single-nucleus RNA sequencing measured gene expression in ${fmt(D.assays[0][2])} nuclei, and single-nucleus ATAC sequencing measured open chromatin in ${fmt(D.assays[1][2])}. A smaller multiome set, ${fmt(D.assays[2][2])} nuclei, measured both in the same nucleus, which helps link regulatory regions to genes. A spatial panel of 366 genes on 18 donors later checks key findings in intact tissue. Clustering found the seven major cell types of the cortex: excitatory and inhibitory neurons, oligodendrocytes and their precursors, endothelial cells, astrocytes and microglia, with four excitatory and five inhibitory subtypes. PTSD brains had fewer oligodendrocytes.` },
  { scene: 2, st: { deg: 1, dur: 2000 },
    cap: `<b>${fmt(DG.ptsd)} genes</b> change in PTSD. Endothelial cells change most, excitatory neurons next; no gene changes in all seven types. ${DG.both} of the PTSD genes, ${(100 * DG.both / DG.ptsd).toFixed(1)}%, also change in depression.`,
    fn: `${SRC}, Fig. 1e,h,i · genes found by both the MAST and Wilcoxon tests; a gene can count in several cell types`,
    note: `Comparing each cell type between PTSD and control donors gives ${fmt(DG.ptsd)} differentially expressed genes, and they are spread unevenly. Endothelial cells have the most, ${degTot.END}, mostly down; excitatory neurons have ${degTot.EXN}, mostly up; and the single subtype with the most is CUX2 excitatory neurons, with ${DG.cux2}. No gene changes in all seven cell types. The same analysis in depression finds ${fmt(DG.mdd)} genes. ${DG.both} are shared, ${(100 * DG.both / DG.ptsd).toFixed(1)} percent of the PTSD genes, while ${DG.ptsdOnly} are specific to PTSD and point to calmodulin signalling, cadherins and ubiquitin binding. Bulk RNA sequencing of a partially overlapping cohort agrees, with a correlation of 0.69.` },
  { scene: 3, st: { end: 1, dur: 1900 },
    cap: 'FKBP5, a gene of the stress-hormone (glucocorticoid) system, rises most in endothelial cells, which line blood vessels. The spatial data confirm it, with the highest levels near vessels.',
    fn: `${SRC}, Fig. 1g and Fig. 2e–h · the explanation is a hypothesis from the paper’s Discussion · vessel drawing is schematic`,
    note: `The stress-hormone system, glucocorticoid signalling, changed most strongly, and unexpectedly, in endothelial cells, the cells that line blood vessels. FKBP5, a gene of this system long linked to PTSD, rises with a log2 fold change of ${FKB.END} in endothelial cells and ${FKB.OLG} in oligodendrocytes. The spatial panel confirms the increase in endothelial cells, with FKBP5 highest near blood vessels, and finds 88 changed endothelial genes, 31 of them also found by single-nucleus sequencing. One possibility the authors raise: with the low cortisol often reported in PTSD, more glucocorticoid would have to cross the blood–brain barrier, and FKBP5 would rise to compensate.` },
  { scene: 4, st: { sst: 1, dur: 2000 },
    cap: 'In PTSD, SST interneurons send less GABA signalling to other neurons, astrocytes, endothelial cells and OPCs, through four GABA receptors. A mouse stress model shows the same weaker inhibition.',
    fn: `${SRC}, Fig. 3 · signalling inferred from transmitter and receptor expression (NeuronChat) · arrow widths are schematic`,
    note: `Cell–cell communication analysis estimates, from the expression of transmitter-synthesis genes and receptors, how strongly each cell type signals to the others. In PTSD, somatostatin, or SST, interneurons stand out: their outgoing signalling drops more than that of any other sender, a log differential of ${String(D.sstOut).replace('-', '−')}. Their GABA signals through the receptors GABRA5, GABBR1, GABRB1 and GABRG1 are weaker, and the largest drop is to KCNG1 interneurons. SST cells also express less of the GABA transporter SLC32A1, and the spatial data show less SST transcript. In mice after single prolonged stress, a model of traumatic stress, GABRA5-mediated inhibition from SST cells onto excitatory neurons was reduced, and so was tonic GABA current. Microglia differ between the disorders: their SPP1 signalling falls in PTSD but rises in depression.` },
  { scene: 5, st: { reg: 1, dur: 2000 },
    cap: 'An open-chromatin peak whose accessibility tracks a gene’s expression is a candidate regulatory element (CRE). Almost all PTSD genes in endothelial cells and excitatory neurons have one.',
    fn: `${SRC}, Fig. 4 and Extended Data Fig. 9 · genome tracks are schematic`,

    const v = ease(clamp(app * 2.2 - 1.0)); op(gVenn, v); op(gVlab, ease(clamp(app * 2.2 - 1.2))); op(gVtxt, ease(clamp(app * 2.2 - 1.2))); }
