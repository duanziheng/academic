<script>
/* Site colours for the slides (public copy). The slides were drawn for a white screen. Light theme: the white takes the
   colour of the homepage, and every colour is multiplied by it, which leaves the rest practically unchanged. Dark theme:
   every colour is mapped in OKLab with its lightness inverted and its hue kept, so the white becomes the page, dark ink
   becomes light text and light tints become dark ones (a little more saturated, so pastel fills do not turn muddy).
   Colours reach a slide only as hex values in SVG attributes, set by its script or written in its markup, and in the
   stylesheet for the slide text, so those are the places mapped. */
(() => {
  const ATTRS = new Set(['fill', 'stroke', 'stop-color', 'flood-color', 'color']);
  const PAGE = { light: [247, 248, 250], dark: [11, 18, 27] }, INK = [231, 237, 243];   // homepage --bg, and its dark --ink
  const lin = v => (v /= 255) <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
  const enc = v => 255 * (v <= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055);
  const lab = c => {
    const [r, g, b] = c.map(lin);
    const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
    const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
    const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s, 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
      0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s];
  };
  const rgb = ([L, A, B]) => {
    const l = (L + 0.3963377774 * A + 0.2158037573 * B) ** 3, m = (L - 0.1055613458 * A - 0.0638541728 * B) ** 3,
      s = (L - 0.0894841775 * A - 1.2914855480 * B) ** 3;
    return [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
      -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s];
  };
  const inside = c => c.every(v => v >= -1e-4 && v <= 1 + 1e-4);
  // t: 0 for the darkest ink (and anything darker), 1 for white. Lightness runs from the light text (t = 0) to the page
  // (t = 1) on a curve that keeps pale fills off the page colour, and strong colours keep some lightness (a dark yellow
  // is no longer yellow). Chroma grows for pale fills, eases for text, and fades into the page's tint near white.
  const P = lab(PAGE.dark), T = lab(INK), LK = 0.25, GAMMA = 0.72, BOOST = 0.8, EASE = 0.45, FLOOR = 2.5;
  const dark = c => {
    const [L, A, B] = lab(c), t = Math.min(1, Math.max(0, (L - LK) / (1 - LK))), w = t * t;
    const L2 = Math.max(P[0] + (T[0] - P[0]) * (1 - t) ** GAMMA, P[0] + FLOOR * Math.hypot(A, B));
    const k = (1 + BOOST * w) * (1 - EASE * (1 - t) ** 2);
    const at = f => rgb([L2, A * k * f + P[1] * w, B * k * f + P[2] * w]);
    let out = at(1);
    if (!inside(out)) {                     // out of gamut: keep the lightness and hue, cut the chroma
      let lo = 0, hi = 1; out = at(0);
      for (let i = 0; i < 18; i++) { const f = (lo + hi) / 2, o = at(f); if (inside(o)) { lo = f; out = o; } else hi = f; }
    }
    return out.map(v => enc(Math.min(1, Math.max(0, v))));
  };
  const light = c => c.map((v, i) => v * PAGE.light[i] / 255);
  const hex = c => '#' + c.map(v => Math.round(Math.min(255, Math.max(0, v))).toString(16).padStart(2, '0')).join('');
  const parse = v => {
    let m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(v.trim());
    if (m) { const h = m[1].length === 3 ? m[1].replace(/./g, x => x + x) : m[1]; return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); }
    m = /^rgb\(\s*(\d+),\s*(\d+),\s*(\d+)\s*\)$/i.exec(v.trim());
    return m ? [+m[1], +m[2], +m[3]] : null;
  };
  const cache = { light: new Map(), dark: new Map() };
  const conv = (v, th) => {
    const key = v.toLowerCase(), C = cache[th];
    let o = C.get(key);
    if (o === undefined) { const c = parse(v); o = c ? hex(th === 'dark' ? dark(c) : light(c)) : v; C.set(key, o); }
    return o;
  };
  const theme = () => { const r = document.documentElement; return r && r.dataset.theme === 'dark' ? 'dark' : 'light'; };
  // every colour attribute an SVG element receives is kept as drawn (el.__c) and written as mapped
  const set = Element.prototype.setAttribute;
  Element.prototype.setAttribute = function (name, value) {
    if (ATTRS.has(name) && this instanceof SVGElement) {
      const v = String(value);
      if (v[0] === '#') { (this.__c || (this.__c = {}))[name] = v; return set.call(this, name, conv(v, theme())); }
      if (this.__c) delete this.__c[name];
    }
    return set.call(this, name, value);
  };
  window.__recolor = v => conv(v, theme());   // for colours a page writes into HTML
  const init = () => {
    for (const el of document.querySelectorAll('svg, svg *')) for (const a of ATTRS) {   // colours written in the markup
      const v = el.getAttribute(a); if (v && v[0] === '#' && !(el.__c && a in el.__c)) el.setAttribute(a, v);
    }
    if (!document.getElementById('ov')) return;
    const rules = [];   // slide text: the stylesheet's colours for the overlay classes, mapped once for the dark theme
    for (const sh of document.styleSheets) {
      let list; try { list = sh.cssRules; } catch (e) { continue; }
      for (const r of list) {
        if (!r.selectorText || !/^\.(ov|kick|ttl|cap|fn|eq)\b/.test(r.selectorText)) continue;
        const d = [];
        for (const p of ['color', 'border-top-color', 'border-right-color', 'border-bottom-color', 'border-left-color']) {
          const v = r.style.getPropertyValue(p); if (v && parse(v)) d.push(`${p}: ${conv(v, 'dark')}`);
        }
        if (d.length) rules.push(r.selectorText.split(',').map(x => ':root[data-theme="dark"] ' + x.trim()).join(', ') + ` { ${d.join('; ')}; }`);
      }
    }
    const st = document.createElement('style'); st.textContent = rules.join('\n'); document.head.appendChild(st);
  };
  let cur = theme();
  const follow = () => new MutationObserver(() => {   // theme switched: write every kept colour again
    const th = theme(); if (th === cur) return; cur = th;
    for (const el of document.querySelectorAll('svg *')) { const c = el.__c; if (c) for (const a in c) set.call(el, a, conv(c[a], th)); }
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (document.querySelector('svg')) { init(); follow(); } else document.addEventListener('DOMContentLoaded', () => { cur = theme(); init(); follow(); });
})();
</script>

(() => {
// ------------------------------------------------------------------ shared helpers
const D = JSON.parse(document.getElementById('toy').textContent);
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const stag = (e, i, N, spread) => clamp((e - spread * (N > 1 ? i / (N - 1) : 0)) / (1 - spread));
const RGB = {};
const rgbOf = h => RGB[h] || (RGB[h] = [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
const toHex = c => '#' + c.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
const mixHex = (a, b, t) => { const A = rgbOf(a), B = rgbOf(b); return toHex([0, 1, 2].map(k => A[k] + (B[k] - A[k]) * t)); };
