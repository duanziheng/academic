name: Verify deployed talk resources
on:
  push:
    branches: [master]
    paths: [.github/workflows/verify-talk-resources.yml]
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public PDF and Genesis note on both pages
        run: |
          python3 - <<'PY'
          import hashlib
          import time
          import urllib.request
          base = 'https://zihengduan.cn'
          asset = '/files/talks/ics-honors-seminar-2026.pdf'
          note = 'Internal company talk; slides are not publicly available at this time.'
          source = 'https://raw.githubusercontent.com/duanziheng/academic/15ca00487b618ed72b10d871fbe6c6dca1a646e9/redesign/dist/files/talks/ics-honors-seminar-2026.pdf'
          def fetch(url):
              request = urllib.request.Request(url, headers={'User-Agent': 'Talk-resources-check', 'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(request, timeout=40) as response:
                  return response.status, response.headers.get('Content-Type', ''), response.read()
          _, _, original = fetch(source)
          assert original.startswith(b'%PDF-')
          expected = hashlib.sha256(original).hexdigest()
          for attempt in range(10):
              try:
                  _, _, home = fetch(base + '/')
                  _, _, genesis = fetch(base + '/talks/genesis-2026-immune-atlases/')
                  _, _, ics = fetch(base + '/talks/ics-honors-seminar-2026/')
                  assert note.encode() in home and note.encode() in genesis, 'Availability note not deployed on both pages yet'
                  assert asset.encode() in home and asset.encode() in ics, 'PDF link not deployed on both pages yet'
                  assert b'ics-honors-seminar-2026.pptx' not in home + ics, 'Old PPTX link remains'
                  status, kind, payload = fetch(base + asset)
                  assert payload.startswith(b'%PDF-') and 'application/pdf' in kind
                  assert hashlib.sha256(payload).hexdigest() == expected, 'Live PDF differs from committed PDF'
                  print('VERIFIED: homepage and Genesis detail both show the internal-company-talk note.')
                  print('VERIFIED: homepage and ICS detail both link to the self-hosted PDF, not PPTX.')
                  print('VERIFIED: public PDF HTTP', status, '|', kind, '|', len(payload), 'bytes | SHA-256', expected)
                  print('LIVE URL:', base + asset)
                  break
              except Exception as error:
                  print('Attempt', attempt + 1, str(error), flush=True)
                  if attempt == 9:
                      raise
                  time.sleep(12)
          PY
