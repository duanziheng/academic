name: Publish ICS Honors Seminar slides

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/publish-ics-honors-slides.yml

permissions:
  contents: write

concurrency:
  group: publish-ics-honors-slides
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Import the owner-provided slide deck and update its website link
        env:
          SLIDES_SOURCE: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-8bd8-81fd-bfc8-ae7804e0d75a/raw?se=2026-10-06T04%3A47%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=eda9af1b-b702-528d-8e24-d6aca8d5568d&skoid=b9a47e8b-72a2-4ed3-8028-a2a98c1a6142&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T02%3A07%3A33Z&ske=2026-10-07T02%3A07%3A33Z&sks=b&skv=2026-02-06&sig=ScIZ%2Bi7HCiYDsnAqwD7w97vUKd9PKGuG0HL1RGiGldE%3D'
        run: |
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          import urllib.request
          import zipfile
          from pathlib import Path

          # This expiring source grants read access only to the slide deck
          # supplied by the owner for public publication. It is not an account token.
          asset = Path('redesign/dist/files/talks/ics-honors-seminar-2026.pptx')
          expected = 'f1484ca9c2b0c0097841517c0cad05f085141595baae3f61696019d62ee6e671'
          if asset.exists():
              payload = asset.read_bytes()
          else:
              with urllib.request.urlopen(os.environ['SLIDES_SOURCE'], timeout=120) as response:
                  payload = response.read()
          if hashlib.sha256(payload).hexdigest() != expected:
              raise SystemExit('Slide deck checksum mismatch; nothing will be published.')
          with zipfile.ZipFile(io.BytesIO(payload)) as deck:
              if deck.testzip() is not None or 'ppt/presentation.xml' not in deck.namelist():
                  raise SystemExit('Invalid PowerPoint archive.')
          asset.parent.mkdir(parents=True, exist_ok=True)
          asset.write_bytes(payload)

          metadata = Path('redesign/content/talks.json')
          talks = json.loads(metadata.read_text(encoding='utf-8'))
          matches = [talk for talk in talks if talk.get('path') == '/talks/ics-honors-seminar-2026/']
          if len(matches) != 1:
              raise SystemExit('Expected exactly one ICS Honors Seminar entry.')
          matches[0]['links'] = [{'label': 'Slides', 'url': '/files/talks/ics-honors-seminar-2026.pptx'}]
          metadata.write_text(json.dumps(talks, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Verified original PowerPoint:', len(payload), 'bytes')
          print('Slides now use a self-hosted website asset.')
          PY
      - name: Commit only the slide deck and its talk metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- redesign/dist/files/talks/ics-honors-seminar-2026.pptx redesign/content/talks.json
          if git diff --cached --quiet; then
            echo 'The slide deck is already published.'
            exit 0
          fi
          git commit -m 'Host ICS Honors Seminar slides directly on the website'
          git pull --rebase origin master
          git push origin HEAD:master
