# Every Monday, check every link on zihengduan.cn (redesign/scripts/check-links.py). When a link is broken, open an
# issue, or add the new report to the open one; it can also be run by hand from the Actions tab.
name: Weekly link check

on:
  schedule:
    - cron: '17 15 * * 1'   # Mondays 15:17 UTC (08:17 in California)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 redesign/scripts/check-links.py https://zihengduan.cn link-report.md
      - name: Report broken links in an issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Broken links on zihengduan.cn"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body-file link-report.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file link-report.md
          fi
          exit 1
