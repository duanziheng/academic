name: Publish talk PDF and availability note
on:
  push:
    branches: [master]
    paths: [.github/workflows/publish-talk-pdf.yml]
permissions:
  contents: write
concurrency:
  group: publish-talk-pdf
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Install PDF validator
        run: python3 -m pip install --disable-pip-version-check PyMuPDF==1.26.7
      - name: Import the reviewed PDF and update talk presentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import urllib.request
          import fitz

          # Public, owner-provided Google Slides source; no account credentials.
          source = 'https://docs.google.com/presentation/d/1SrbVf809bqqE-jWfHzIRmHrrheUoYFOrptTSnesTZjg/export/pdf'
          request = urllib.request.Request(source, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(request, timeout=180) as response:
              payload = response.read()
          if not payload.startswith(b'%PDF-'):
              raise SystemExit('Source did not return a PDF; no changes published.')
          document = fitz.open(stream=payload, filetype='pdf')
          if len(document) != 34:
              raise SystemExit('Expected the reviewed 34-page presentation.')
          expected_sha = '6ef99cb41a23a9a4dc8426a244d06b57ac08bd464a4eca368ab95346d0be2a0a'
          actual_sha = hashlib.sha256(payload).hexdigest()
          # Google exports may differ only in metadata; verify every page visually.
          if actual_sha != expected_sha:
              visual = hashlib.sha256()
              for page in document:
                  pix = page.get_pixmap(matrix=fitz.Matrix(.5, .5), alpha=False)
                  visual.update(f'{pix.width}x{pix.height}:'.encode())
                  visual.update(pix.samples)
              if visual.hexdigest() != 'd6c1d213ef04a8bea35d464bbbea57ff6b71b7cf957fa9e564d75f41317f24fd':
                  raise SystemExit('Export differs from the reviewed deck; no changes published.')
          document.close()
          pdf = Path('redesign/dist/files/talks/ics-honors-seminar-2026.pdf')
          pdf.write_bytes(payload)

          metadata = Path('redesign/content/talks.json')
          talks = json.loads(metadata.read_text(encoding='utf-8'))
          def one(path):
              found = [t for t in talks if t.get('path') == path]
              if len(found) != 1:
                  raise SystemExit('Expected exactly one talk at ' + path)
              return found[0]
          ics = one('/talks/ics-honors-seminar-2026/')
          slides = [link for link in ics['links'] if link.get('label') == 'Slides']
          if len(slides) != 1:
              raise SystemExit('Expected one ICS Slides link.')
          slides[0]['url'] = '/files/talks/ics-honors-seminar-2026.pdf'
          genesis = one('/talks/genesis-2026-immune-atlases/')
          if any(link.get('label') == 'Slides' for link in genesis['links']):
              raise SystemExit('Genesis slides visibility changed; review before continuing.')
          genesis['slides_note'] = 'Internal company talk; slides are not publicly available at this time.'
          metadata.write_text(json.dumps(talks, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          template = Path('redesign/build.py')
          text = template.read_text(encoding='utf-8')
          old = " return '<div class=\"resource-links\">'+''.join(parts)+'</div>'"
          new = " return ('<div class=\"resource-links\">'+''.join(parts)+'</div>' if parts else '')+('<p class=\"muted talk-slides-note\">'+e(p['slides_note'])+'</p>' if p.get('slides_note') else '')"
          if text.count(old) != 1:
              raise SystemExit('Resource-link renderer changed; review before continuing.')
          template.write_text(text.replace(old, new, 1), encoding='utf-8')
          # Replace the public PPTX asset with PDF; the source deck remains intact.
          Path('redesign/dist/files/talks/ics-honors-seminar-2026.pptx').unlink(missing_ok=True)
          print('PDF verified:', len(payload), 'bytes; 34 pages; SHA-256', actual_sha)
          print('Genesis note:', genesis['slides_note'])
          PY
      - name: Build and validate the website
        run: |
          python3 redesign/scripts/build-netlify.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path('redesign/netlify-dist')
          note = 'Internal company talk; slides are not publicly available at this time.'
          asset = '/files/talks/ics-honors-seminar-2026.pdf'
          home = (root / 'index.html').read_text()
          detail = (root / 'talks/genesis-2026-immune-atlases/index.html').read_text()
          ics = (root / 'talks/ics-honors-seminar-2026/index.html').read_text()
          assert home.count(note) == 1 and detail.count(note) == 1
          assert asset in home and asset in ics
          assert 'ics-honors-seminar-2026.pptx' not in home + ics
          assert (root / asset.lstrip('/')).read_bytes().startswith(b'%PDF-')
          talks = json.loads(Path('redesign/content/talks.json').read_text())
          assert all(link['url'].endswith('.pdf') for t in talks for link in t['links'] if link['label'] == 'Slides')
          print('Homepage, both talk pages, all public slide formats, and Genesis availability note verified.')
          PY
      - name: Commit only the requested changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- redesign/build.py redesign/content/talks.json redesign/dist/files/talks/ics-honors-seminar-2026.pdf redesign/dist/files/talks/ics-honors-seminar-2026.pptx
          git diff --cached --stat
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use PDF for ICS Honors slides and explain Genesis slides availability'
          git restore --worktree .
          git pull --rebase origin master
          git push origin HEAD:master
